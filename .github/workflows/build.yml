name: Build

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
#                                                                             #
#                    ZETTLR MAIN BUILD GITHUB ACTIONS FILE                    #
#                                                                             #
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
#                                                                             #
# This file contains the logic necessary to build a full release from source. #
#                                                                             #
# WHEN IT RUNS:                                                               #
#                                                                             #
# * Manually                                                                  #
#                                                                             #
# HOW IT RUNS:                                                                #
#                                                                             #
# 1. Native Windows, macOS, and Ubuntu runners build release artifacts for    #
#    their supported OS/architecture pairs.                                   #
# 2. Each build job uploads only its final release artifacts.                 #
# 3. Iff (if and only if) all build runners have shut down successfully,      #
#    indicating successful builds, another Ubuntu VM will be started. That    #
#    one is tasked with downloading all releases from the three artifact      #
#    spaces, calculate the SHA-256 checksums for every file and afterwards    #
#    upload all files to a newly created release draft here on GitHub.        #
#                                                                             #
# THINGS TO NOTE:                                                             #
#                                                                             #
# * Every runner will retrieve the package.json's "version" field by running  #
#   a somewhat weird-looking command. This is necessary to make finding the   #
#   releases easier which are being produced by electron-forge and electron-  #
#   builder.                                                                  #
# * Especially the macOS runner can often produce problems, because there     #
#   have been rumors that apparently even the macOS server operating systems  #
#   tend to open modal windows -- even though they're running headless.       #
# * Everything is being run on Bash. Although PowerShell can do a lot, this   #
#   way all steps are within one language, making it easier to maintain.      #
#                                                                             #
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

on:
  # Releases must be manually started.
  workflow_dispatch: {}

permissions:
  contents: write

# Defaults for every job and step in this workflow
defaults:
  run:
    shell: bash # Run everything using bash

# Global environment variables
env:
  NODE_VERSION: '22'
  # DEBUG: '*' # Uncomment to debug Electron building packages

# Ensure only a single build workflow runs at any one time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# This workflow file runs preflight checks, builds the corresponding releases
# on all supported platforms, and creates the release draft.
jobs:
  # First, ensure that nothing breaks before attempting to build
  preflight:
    name: 'Preflight'
    uses: ./.github/workflows/check.yml
  # Verify that package.json has been bumped before attempting release builds.
  verify_version:
    name: 'Preflight: Verify version tag'
    needs: [preflight]
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repository (${{ github.ref_name }} branch)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0 # Required for the tag verification step.
      - name: Retrieve tag version
        id: ref
        run: echo "version=$(node -p 'require(process.cwd() + "/package.json").version')" >> "$GITHUB_ENV"
      - name: Verify the corresponding tag does not yet exist
        # NOTE: the ! will return 0 if the command fails, and 1 otherwise
        run: '! git rev-parse "v${{ env.version }}"'




  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  #                                                                           #
  #                              WINDOWS BUILDS                               #
  #                                                                           #
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  build_win_x64:
    name: Windows (x86_64)
    env:
      npm_config_arch: x64
    needs: [preflight, verify_version]
    runs-on: windows-latest
    steps:
      - name: Checkout branch ${{ github.ref_name }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Setup NodeJS ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache: 'yarn' Disable to enable Windows builds, context: https://github.com/actions/setup-node/issues/1027
      - name: Enable Yarn 4.x
        run: corepack enable
      - name: Activate Yarn from package.json (Windows)
        run: corepack prepare "$(node -p 'require(process.cwd() + "/package.json").packageManager')" --activate
      - name: Set up build environment
        run: yarn install --immutable
      - name: Retrieve tag version
        id: ref
        run: |
          echo "version=$(node -p 'require(process.cwd() + "/package.json").version')" >> "$GITHUB_ENV"
          echo "artifactProductName=$(node -p 'require(process.cwd() + "/package.json").productName.replace(/\s+/g, "-")')" >> "$GITHUB_ENV"
      - name: Package & Release
        run: yarn package:win-x64 && yarn release:win-x64
      - name: Cache installer
        uses: actions/upload-artifact@v6
        with:
          name: win32_x64
          path: |
            ./release/${{ env.artifactProductName }}-${{ env.version }}-x64.exe

  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  #                                                                           #
  #                               MACOS BUILDS                                #
  #                                                                           #
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  build_macos_x64:
    name: macOS (x86_64)
    env:
      npm_config_arch: x64
    needs: [preflight, verify_version]
    runs-on: macos-15-intel
    steps:
      - name: Checkout branch ${{ github.ref_name }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Enable Yarn 4.x
        run: corepack enable
      - name: Setup NodeJS ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
      - name: Set up build environment
        run: yarn install --immutable
      - name: Retrieve tag version
        id: ref
        run: |
          echo "version=$(node -p 'require(process.cwd() + "/package.json").version')" >> "$GITHUB_ENV"
          echo "artifactProductName=$(node -p 'require(process.cwd() + "/package.json").productName.replace(/\s+/g, "-")')" >> "$GITHUB_ENV"
      - name: Package
        run: yarn package:mac-x64
      - name: Release
        run: yarn release:mac-x64
      - name: Cache image file
        uses: actions/upload-artifact@v6
        with:
          name: darwin_x64
          path: |
            ./release/${{ env.artifactProductName }}-${{ env.version }}-x64.dmg

  build_macos_arm64:
    name: macOS (arm64)
    env:
      npm_config_arch: arm64
    needs: [preflight, verify_version]
    runs-on: macos-latest
    steps:
      - name: Checkout branch ${{ github.ref_name }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Enable Yarn 4.x
        run: corepack enable
      - name: Setup NodeJS ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
      - name: Set up build environment
        run: yarn install --immutable
      - name: Retrieve tag version
        id: ref
        run: |
          echo "version=$(node -p 'require(process.cwd() + "/package.json").version')" >> "$GITHUB_ENV"
          echo "artifactProductName=$(node -p 'require(process.cwd() + "/package.json").productName.replace(/\s+/g, "-")')" >> "$GITHUB_ENV"
      - name: Package
        run: yarn package:mac-arm
      - name: Release
        run: yarn release:mac-arm
      - name: Cache image file
        uses: actions/upload-artifact@v6
        with:
          name: darwin_arm64
          path: |
            ./release/${{ env.artifactProductName }}-${{ env.version }}-arm64.dmg

  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  #                                                                           #
  #                               LINUX BUILDS                                #
  #                                                                           #
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  build_linux_x64:
    name: Linux (x86_64)
    env:
      npm_config_arch: x64
      CC: zig cc -target x86_64-linux-gnu
      CXX: zig c++ -target x86_64-linux-gnu
    needs: [preflight, verify_version]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch ${{ github.ref_name }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Enable Yarn 4.x
        run: corepack enable
      - name: Setup NodeJS ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
      # Replicate PR #4910 on the x86_64 runner as this compiler appears
      # still to be supported by node-gyp even after the most recent update.
      # (NOTE: See added CC/CCX variables, found from output under 'zig targets'
      # here: https://andrewkelley.me/post/zig-cc-powerful-drop-in-replacement-gcc-clang.html)
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
      - name: Set up build environment
        run: yarn install --immutable
      - name: Retrieve tag version
        id: ref
        run: |
          echo "version=$(node -p 'require(process.cwd() + "/package.json").version')" >> "$GITHUB_ENV"
          echo "artifactProductName=$(node -p 'require(process.cwd() + "/package.json").productName.replace(/\s+/g, "-")')" >> "$GITHUB_ENV"
      - name: Package & Release
        run: |
          yarn package:linux-x64
          yarn release:linux-x64
      - name: Cache installers
        uses: actions/upload-artifact@v6
        with:
          name: linux_x64
          path: |
            ./release/${{ env.artifactProductName }}-${{ env.version }}-amd64.deb
            ./release/${{ env.artifactProductName }}-${{ env.version }}-x86_64.rpm
            ./release/${{ env.artifactProductName }}-${{ env.version }}-x86_64.AppImage

  build_linux_arm64:
    name: Linux (arm64)
    env:
      npm_config_arch: arm64
      CC: zig cc -target aarch64-linux-gnu
      CXX: zig c++ -target aarch64-linux-gnu
    needs: [preflight, verify_version]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch ${{ github.ref_name }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Enable Yarn 4.x
        run: corepack enable
      - name: Setup NodeJS ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
      - name: Set up build environment
        run: yarn install --immutable
      - name: Retrieve tag version
        id: ref
        run: |
          echo "version=$(node -p 'require(process.cwd() + "/package.json").version')" >> "$GITHUB_ENV"
          echo "artifactProductName=$(node -p 'require(process.cwd() + "/package.json").productName.replace(/\s+/g, "-")')" >> "$GITHUB_ENV"
      - name: Package & Release
        run: |
          yarn package:linux-arm
          yarn release:linux-arm
      - name: Cache installers
        uses: actions/upload-artifact@v6
        with:
          name: linux_arm64
          path: |
            ./release/${{ env.artifactProductName }}-${{ env.version }}-arm64.deb
            ./release/${{ env.artifactProductName }}-${{ env.version }}-aarch64.rpm
            ./release/${{ env.artifactProductName }}-${{ env.version }}-arm64.AppImage

  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  #                                                                           #
  #                          PREPARE RELEASE DRAFT                            #
  #                                                                           #
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  # After the three builds, this job downloads all assets, creates and verifies
  # SHA256 checksums, and finally creates a release draft and uploads all
  # assets to it.
  prepare_release:
    name: Prepare release draft
    # Make sure (and wait until) the builds have succeeded
    needs:
      - build_win_x64
      - build_macos_x64
      - build_macos_arm64
      - build_linux_x64
      - build_linux_arm64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout branch ${{ github.ref_name }}
        uses: actions/checkout@v6
      - name: Setup NodeJS ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Retrieve tag version
        id: ref
        run: |
          echo "version=$(node -p 'require(process.cwd() + "/package.json").version')" >> "$GITHUB_ENV"
          echo "artifactProductName=$(node -p 'require(process.cwd() + "/package.json").productName.replace(/\s+/g, "-")')" >> "$GITHUB_ENV"
      - name: Make release directory
        run: mkdir ./release
      # Download all resulting assets from the previous steps.
      - name: Retrieve installers (Windows x86_64)
        uses: actions/download-artifact@v7
        with:
          name: win32_x64
          path: ./release
      - name: Retrieve installers (macOS x86_64)
        uses: actions/download-artifact@v7
        with:
          name: darwin_x64
          path: ./release
      - name: Retrieve installers (macOS arm64)
        uses: actions/download-artifact@v7
        with:
          name: darwin_arm64
          path: ./release
      - name: Retrieve installers (Linux x86_64)
        uses: actions/download-artifact@v7
        with:
          name: linux_x64
          path: ./release
      - name: Retrieve installers (Linux arm64)
        uses: actions/download-artifact@v7
        with:
          name: linux_arm64
          path: ./release
      - name: Verify expected release artifacts
        run: |
          cd ./release
          expected_files=(
            "${artifactProductName}-${version}-x64.exe"
            "${artifactProductName}-${version}-x64.dmg"
            "${artifactProductName}-${version}-arm64.dmg"
            "${artifactProductName}-${version}-amd64.deb"
            "${artifactProductName}-${version}-arm64.deb"
            "${artifactProductName}-${version}-x86_64.rpm"
            "${artifactProductName}-${version}-aarch64.rpm"
            "${artifactProductName}-${version}-x86_64.AppImage"
            "${artifactProductName}-${version}-arm64.AppImage"
          )

          for file in "${expected_files[@]}"; do
            test -f "$file"
          done
      # Generate the checksums
      - name: Generate SHA256 checksums
        run: |
          cd ./release
          sha256sum "${artifactProductName}-${version}-x64.exe" > "SHA256SUMS.txt"
          sha256sum "${artifactProductName}-${version}-x64.dmg" >> "SHA256SUMS.txt"
          sha256sum "${artifactProductName}-${version}-arm64.dmg" >> "SHA256SUMS.txt"
          sha256sum "${artifactProductName}-${version}-x86_64.AppImage" >> "SHA256SUMS.txt"
          sha256sum "${artifactProductName}-${version}-arm64.AppImage" >> "SHA256SUMS.txt"
          sha256sum "${artifactProductName}-${version}-amd64.deb" >> "SHA256SUMS.txt"
          sha256sum "${artifactProductName}-${version}-arm64.deb" >> "SHA256SUMS.txt"
          sha256sum "${artifactProductName}-${version}-x86_64.rpm" >> "SHA256SUMS.txt"
          sha256sum "${artifactProductName}-${version}-aarch64.rpm" >> "SHA256SUMS.txt"
          cd ..
      - name: Verify checksums
        run: |
          cd ./release
          sha256sum -c SHA256SUMS.txt
          cd ..
      # Create a new release draft
      - name: Create release draft
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Populate the inputs of the release we already know
          tag_name: v${{ env.version }}
          name: Release v${{ env.version }}
          body: If you can read this, we have forgotten to fill in the changelog. Sorry!
          draft: true # Always create as draft, so that we can populate the remaining values easily
          # Gosh, is that convenient as opposed to earlier!
          files: |
            ./release/${{ env.artifactProductName }}-${{ env.version }}-x64.exe
            ./release/${{ env.artifactProductName }}-${{ env.version }}-x64.dmg
            ./release/${{ env.artifactProductName }}-${{ env.version }}-arm64.dmg
            ./release/${{ env.artifactProductName }}-${{ env.version }}-amd64.deb
            ./release/${{ env.artifactProductName }}-${{ env.version }}-arm64.deb
            ./release/${{ env.artifactProductName }}-${{ env.version }}-x86_64.rpm
            ./release/${{ env.artifactProductName }}-${{ env.version }}-aarch64.rpm
            ./release/${{ env.artifactProductName }}-${{ env.version }}-x86_64.AppImage
            ./release/${{ env.artifactProductName }}-${{ env.version }}-arm64.AppImage
            ./release/SHA256SUMS.txt
